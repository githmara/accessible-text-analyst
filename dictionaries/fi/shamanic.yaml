oracle:
  header: |+
    --- TIETOISUUDEN VIRRAN ORAAKKELI ---
    TTS-ohje: lue hitaasti, kasvavalla kaiulla.

  pause: '[TAUKO 1.5s]'

roots:
  header: |+
    --- RAAKOJEN JUURTEN RITUAALI ---
    TTS-ohje: mekaaninen luku, epäinhimillinen, tunteeton.

lore:
  header: |+
    // LÖYDÖN TUNNUS: TOPIC-{topic_id} / FRAGMENT-{para_id} //
    // TILA: VAURIOITUNUT RADIOTALLENNE //

prophecy:
  header: |+
    --- TOMUSTA NOUSEVAN ENNUSTUKSEN KIRJA ---
    TTS-ohje: lue arvokkaasti, tauoilla ennen kaksoispisteitä.

  section: '[ENNUSTUS {n}]'
  templates:
    - 'Tomusta — {loc} — nousee {per}, joka: {sentence}'
    - 'Kun veren kuu riippuu paikan {loc} yllä, {per} lausuu: {sentence}'
    - 'Yhteisön {org} sisältä kuiskaa {per} kohti paikkaa {loc}: {sentence}'
    - 'Muinainen ääni — {loc} — puhuu hahmon {per} kautta: {sentence}'
  fallback:
    loc: 'nimetön maa'
    per: 'Nimetön'
    org: 'unohdettu veljeskunta'

katla:
  header: |+
    --- JÄÄTYNEIDEN OLENTOJEN MONOLOGI (ÄÄNI: KATLA) ---

vieno:
  header: |+
    --- KAIKUJEN SAMAANIKUTSU (ÄÄNI: VIENO) ---

lumi:
  header: |+
    --- VIIMEINEN RAPORTTI KYLMÄSTÄ POHJOLASTA (ÄÄNI: LUMI) ---

  fallback:
    katla: '(hiljaisuus — Katla ei ole vielä puhunut)'
    vieno: '(vaitiolo — Vienon laulu ei ole saapunut)'

sami:
  header: |+
    --- SAMIN KIPINÄ: ENERGINEN SYNTEESI ---
    TTS-ohje: lue suurella innolla, leveällä hymyllä ja korkealla dynamiikalla.

undertow:
  header: |+
    --- POHJAVIRTA: TEKSTIN TUNNEVUOKSI ---
    TTS-ohje: lue kuin nousu- ja laskuvesi, tauoilla aaltojen välissä.

  mood_negative: 'pimeys'
  mood_neutral: 'hiljaisuus'
  mood_positive: 'valo'
  summary_header: 'Vuoksen tasapaino:'

pipeline:
  starting: 'Käynnistetään šamaanista käsittelyputkea...'
  info_detected_lang: '[INFO] Tunnistettu korpuksen kieli: {language}'
  warn_no_export_dir: '[VAROITUS] Hakemistoa {path} ei ole olemassa.'
  ok_oracle: '[OK] Oraakkeli luotu: {filename}'
  ok_lore: '[OK] Lore-katkelmat luotu: {dirname}/'
  ok_roots: "[OK] Raa'at Juuret luotu: {filename}"
  ok_prophecies: '[OK] Ennustukset luotu: {filename}'
  ok_undertow: '[OK] Pohjavirta luotu: {filename}'
  done: '[VALMIS] Kaikki ääniartefaktit ovat valmiina kansiossa audio_scripts.'
  warn_ritual_failed: '[VIRHE] Rituaali "{ritual}" epäonnistui: {error}'
  done_with_errors: '[KESKEN] Kaikki rituaalit eivät onnistuneet ({failed}/{total}). Jokin meni pieleen — katso viestit yltä.'
  warn_nothing_produced: '[KESKEN] Yhtään ääniartefaktia ei syntynyt. Notebookia (tai sen vientisolua) ei todennäköisesti suoritettu hakemistossa {path}.'
  err_no_notebook_output: 'Pakollinen tiedosto {path} puuttuu — notebookia (tai sen vientisolua) ei todennäköisesti suoritettu.'
  err_faulty_input: 'Tiedosto {filename} on tyhjä tai vioittunut — jokin meni pieleen rituaalissa "{ritual}".'
  fatal_error: '[KRIITTINEN VIRHE] {error}'

ai:
  starting: 'Käynnistetään edistyneitä LLM-loitsuja tuonpuoleisen avaimella...'
  info_detected_lang: '[INFO] Tunnistettu korpuksen kieli: {language}'
  llm_katla: '[LLM] Kutsutaan henkiä Muunnoksen Rituaalia varten...'
  ok_katla: '[OK] Katlan monologi tallennettu: {filename}'
  llm_vieno: '[LLM] Kudotaan ulottuvuuksia Kaikujen Rituaalia varten...'
  ok_vieno: '[OK] Vienon laulu tallennettu: {filename}'
  llm_lumi: '[LLM] Kutsutaan Lumi lopulliseen raporttiin...'
  ok_lumi: '[OK] Lumin raportti tallennettu: {filename}'
  llm_sami: '[LLM] Kutsutaan Samin kipinää valaisemaan Pohjolan synkkyyttä...'
  ok_sami: '[OK] Samin kipinäinen synteesi tallennettu: {filename}'
  done: '[VALMIS] Taikuus suoritettu onnistuneesti.'
  warn_ritual_failed: '[VIRHE] Rituaali "{ritual}" epäonnistui: {error}'
  done_with_errors: '[KESKEN] Kaikki LLM-rituaalit eivät onnistuneet ({failed}/{total}). Jokin meni pieleen — katso viestit yltä.'
  warn_nothing_produced: '[KESKEN] Yksikään Pohjolan ääni ei puhunut. Notebookia ei todennäköisesti suoritettu tai paikallista putkea (prophecies.txt) ei ajettu ensin.'
  err_no_export_dir: 'Hakemistoa {path} ei ole — notebookia (tai sen vientisolua) ei todennäköisesti suoritettu.'
  err_no_notebook_output: 'Tiedosto {path} puuttuu, vaikka aiheita on — notebookin viennissä meni jokin pieleen.'
  warn_vieno_too_few_sentences: 'Vienon näky perustuu alle viiteen raakalauseeseen (löytyi {count}) — laulusta tulisi ohut, joten rituaali keskeytettiin. Tarkista, että notebook tuotti täyden sentences.csv-tiedoston.'
  fatal_error: '[KRIITTINEN VIRHE] {error}'
