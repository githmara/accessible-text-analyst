llm:
  info_provider: '[LLM] Provider {provider}, model {model}, endpoint {endpoint}.'
  err_legacy_base_url: '[ERROR] The config key "{name}" is no longer supported: it sent OPENAI_API_KEY to any address. Remove it and set "kirja_llm_provider" instead — "openrouter" (key OPENROUTER_API_KEY) or "openai_compat" (key LLM_COMPAT_API_KEY, address in "llm_base_url").'
  err_unknown_provider: '[ERROR] Unknown LLM provider "{provider}". Known: {known}.'
  err_compat_no_base_url: '[ERROR] Provider openai_compat needs "llm_base_url" in the config.'
  err_compat_no_model: '[ERROR] Provider openai_compat has no default model — set "llm_model" (or the Book''s kirja_*_model) in the config, or pass --model.'
  err_no_sdk: '[ERROR] The openai or python-dotenv package is missing (pip install -r requirements.txt).'
  err_no_key: '[ERROR] {var} was not found in golden_key.env (needed by provider {provider}). Each provider reads only its own key.'
  info_degraded: '[INFO] {endpoint} rejected response_format {mode} ({error}). Falling back to {next}.'
  info_no_temperature: '[INFO] Model {model} accepts only the default temperature (rejected {temperature}). Retrying without it; the rest of this run skips it for this model.'
  diag_reply: '[DIAG] Mode {mode}, finish_reason {finish}, reply of {chars} characters{refusal}. Full reply: {path}'
  diag_refusal: ', refusal: "{text}"'
