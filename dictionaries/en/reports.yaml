generate_report:
  html_title: 'Report: Text Analysis'
  ok_report_generated: '[OK] Accessible HTML report generated successfully: {path}'
  info_target_lang: '[INFO] Detected target language for tagging: {language}'
  info_remove_noise_active: '[INFO] Technical-noise removal mode (lemmatization, POS, logs) is ACTIVE.'
  gate_no_outputs: '[REFUSED] {notebook} contains no output of the corpus cell: the notebook was not run, or its outputs were not saved to the file (in VS Code, save the notebook after running it). No report was written.'
  gate_source_mismatch: '[REFUSED] The notebook outputs come from a different source: {ran}. The config points to: {source}. Run the notebook for the configured source and save it (or restore source_file), then generate the report again.'
  gate_source_vs_empty: '[REFUSED] The notebook outputs come from {ran}, but source_file in the config is empty (the report would go to the built-in example folder).'
  gate_builtin_vs_config: '[REFUSED] The notebook outputs come from the built-in example corpus, but the config points to: {source}. Run the notebook for that source and save it.'
  gate_source_not_loaded: '[REFUSED] The notebook could not load {source} and analysed the built-in example corpus instead. Check the warnings of the first cell (missing file, missing library, empty text).'
  gate_dir_mismatch: '[REFUSED] The notebook wrote its exports to {ran}, but the report would go to {folder}.'
  gate_run_incomplete: '[REFUSED] The run saved in {notebook} did not reach the end of the export cell (it stopped earlier or was interrupted): the exports in the folder come from an earlier run. Fix the cause and run the notebook to the end.'
  gate_outputs_not_saved: '[REFUSED] {export} is newer than {notebook}: the outputs of the last notebook run were not saved to the file. Save the notebook (or run the whole chain with run_all.py), then generate the report again.'
  gate_content_mismatch: '[REFUSED] None of the {checked} page openings printed by the notebook occurs in {source}: the file has changed since the notebook was run. Run the notebook again.'
  gate_ok_content: '[OK] Source check: the notebook outputs belong to the configured source ({found} of {checked} page openings found in the file).'
  gate_ok_path_only: '[INFO] Source check: the path and the save time agree; the content could not be compared ({reason}).'
  gate_ok_builtin: '[OK] Source check: built-in example corpus, as the config says.'
  gate_reason_url: 'a web address is not downloaded again'
  gate_reason_image: 'an image is read only by OCR'
  gate_reason_missing_file: 'the source file no longer exists'
  gate_reason_format: 'unknown file format'
  gate_reason_library: 'the library for this format is not installed'
  gate_reason_no_text: 'the file has no text layer, the notebook read it by OCR'
  gate_reason_garbled: 'the text layer of the file is garbled'
  gate_reason_no_previews: 'the notebook printed no usable page openings'
  gate_reason_ocr: 'some pages have no text layer, the notebook read them by OCR'
  gate_reason_custom_patterns: 'custom_patterns from the config changed the text before the page openings'
  gate_reason_unreadable: 'the source file cannot be read (damaged or replaced)'
  info_omorfi_active: '[INFO] omorfi corrected the Finnish lemmas in this run (marked in the report for the Book of the Unsaid).'
  info_omorfi_inactive: '[INFO] Finnish corpus WITHOUT omorfi in this run (package or automata missing, or loading failed) — marked in the report.'

generate_md:
  error_file_not_found: '[ERROR] File not found: {path}'
  ok_markdown_ready: '[OK] Markdown report ready: {path}'

