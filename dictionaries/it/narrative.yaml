intro: |
  # Analisi del testo accessibile (spaCy · TF-IDF · KMeans)

  Una pipeline completa di analisi del testo con supporto per **polacco, russo, inglese, italiano, finlandese e islandese**.
  Tutti i risultati vengono emessi tramite `print()` — niente codici di colore, niente pseudografica.
  Compatibile con gli screen reader **NVDA** e **JAWS**.

  **L'unica cosa richiesta all'utente:** impostare il percorso di un file `.pdf`, `.txt` o `.docx` nella prima cella di codice. Se il file non viene trovato, viene utilizzato un esempio integrato.

  ---

  **Fasi dell'analisi:**

  1. **Caricamento del corpus** — PDF pagina per pagina (pdfplumber), TXT, DOCX (python-docx), HTML locale o **URL** (indirizzo diretto della pagina); BeautifulSoup rimuove la navigazione, le barre laterali e i blocchi "articoli correlati" durante il caricamento da URL o HTML; esempio integrato come fallback.
  2. **Rilevamento della lingua** — `lingua-language-detector` determina la lingua dominante del corpus e funge contemporaneamente da rilevatore per ogni paragrafo e ogni frase (usato in fase di esportazione).
  3. **Modello linguistico spaCy** — la variante **Large (lg)** è selezionata automaticamente: `pl_core_news_lg`, `ru_core_news_lg`, `en_core_web_lg`, `it_core_news_lg`, `fi_core_news_lg`; per l'islandese (`is`) — `spacy.blank("is")` + Hugging Face (IceBERT, MIM-GOLD-22). I modelli sono caricati a richiesta tramite `get_nlp(lang)`, protetto da `functools.lru_cache(maxsize=2)`: al massimo due modelli risiedono in RAM simultaneamente, gli altri vengono espulsi in base a LRU.
  4. **Correzione del testo** — rimozione delle duplicazioni esatte di parole (tutte le lingue); normalizzazione delle abbreviazioni con spazi per il polacco (`m. in.`→`m.in.`), il russo (`т. е.`→`т.е.`) e l'inglese (`e. g.`→`e.g.`).
  5. **NLP di base** — tokenizzazione in parole e frasi, filtraggio delle stop-word, lemmatizzazione, tagging POS (NOUN/VERB/ADJ/…).
  6. **Entità nominate (NER)** — persone, organizzazioni, luoghi, date e altri oggetti menzionati (con un riepilogo di frequenza sull'intero corpus).
  7. **Bag of words (CountVectorizer)** — matrice di frequenza con stop-word specifiche per la lingua; top-10 parole e top-5 bigrammi.
  8. **TF-IDF e ricerca automatica** — la query viene costruita automaticamente dai top-termini del corpus; la similarità coseno è garantita > 0.
  9. **Struttura del testo** — l'intero corpus viene unito in un singolo flusso, suddiviso in frasi da spaCy e raggruppato in paragrafi di 3–6 frasi; per ogni paragrafo e frase, `lingua` registra il codice ISO della lingua che successivamente finisce in HTML/DOCX.
  10. **Parole chiave** — tabella classificata di termini e frasi (1–3 parole) per TF-IDF medio pesato a livello di paragrafo.
  11. **Tesi** — la frase con la somma TF-IDF più alta di ogni paragrafo; salvata in un file `.txt` localizzato sulla lingua del corpus nel formato `- frase`.
  12. **Modellazione degli argomenti (KMeans)** — clustering dei paragrafi tramite vettori spaCy; per ogni argomento — parole chiave e frammento di esempio *(richiede un modello `*_md` o `*_lg` con vettori)*.
  13. **Esportazione dei risultati** — CSV (UTF-8 BOM, compatibile con Excel), JSON (parole chiave degli argomenti), TXT (tesi) e **HTML/DOCX accessibile** con attributo `lang` su ogni paragrafo/frase — gli screen reader cambiano voce automaticamente sulla lingua corretta.
  14. **Report di sintesi** — tutte le metriche chiave in un singolo blocco di testo.

langdet: |
  ## 1) Rilevamento della lingua (lingua)

  Viene utilizzata la libreria [`lingua-language-detector`](https://github.com/pemistahl/lingua-py) — un rilevatore statistico basato su n-grammi e dizionari. Su frammenti brevi e con frequenti cambi di lingua è notevolmente più accurato di `langdetect`, il che è critico per il tagging a livello di paragrafo e frase.

  **Architettura:**

  - In questa fase, il rilevatore determina la **lingua dominante** dell'intero corpus e la memorizza nella variabile globale `LANG`. Questo codice seleziona il modello spaCy per la pipeline NLP principale.
  - L'oggetto globale `LANG_DETECTOR` e la funzione `detect_lang(text)` restano disponibili nelle celle successive. Nella fase "Struttura del testo" vengono applicati a ogni paragrafo e a ogni frase, producendo le liste `para_langs` e `sent_langs`.
  - Queste liste vengono consumate dalla cella di esportazione: ogni `<p lang="...">` in HTML e ogni `Run` in DOCX riceve il codice ISO corretto, e lo screen reader (NVDA, JAWS, Narrator, VoiceOver) cambia automaticamente voce/pronuncia sulla lingua corretta.

  Lingue supportate: **polacco** (`pl`), **russo** (`ru`), **inglese** (`en`), **italiano** (`it`), **finlandese** (`fi`), **islandese** (`is`).

  > Se il corpus contiene lingue miste, la lingua dominante riceve il modello spaCy, le altre vengono marcate in HTML/DOCX tramite l'attributo `lang`.

model: |
  ## 2) Caricamento del modello linguistico spaCy (cache LRU)

  spaCy utilizza modelli pre-addestrati per tokenizzazione, lemmatizzazione, tagging POS e NER.
  Il modello della lingua dominante viene selezionato **automaticamente** in base al risultato della cella precedente.

  **Caricamento dinamico dei modelli:**

  - Il caricamento è incapsulato nella funzione `get_nlp(lang)`, avvolta in `functools.lru_cache(maxsize=2)`.
  - In RAM risiedono simultaneamente al massimo **due** modelli spaCy. Quando viene richiesta una terza lingua, il modello meno recentemente utilizzato viene espulso e liberato dal garbage collector — questo previene l'accumulo di memoria sui corpora multilingue.
  - Il vecchio nome `load_nlp_model` è mantenuto come alias per retrocompatibilità.

  > **Importante:** il notebook utilizza i modelli versione **Large (lg)**, che contengono i vettori di parole completi. Questo migliora significativamente la qualità della modellazione degli argomenti (KMeans) e del riconoscimento di entità nominate (NER) rispetto alle varianti `sm`.

  | Lingua | Codice | Modello |
  |--------|--------|---------|
  | English | `en` | `en_core_web_lg` |
  | Polish | `pl` | `pl_core_news_lg` |
  | Russian | `ru` | `ru_core_news_lg` |
  | Italian | `it` | `it_core_news_lg` |
  | Finnish | `fi` | `fi_core_news_lg` |
  | Icelandic | `is` | `spacy.blank("is")` + IceBERT (vettori) + MIM-GOLD-22 (NER) |

  Se il modello non è installato, il notebook utilizza il tokenizer di base (`spacy.blank`) e segnala il comando di installazione.

pl_corrector: |
  ## Correzione del testo e normalizzazione delle abbreviazioni

  Corregge automaticamente gli errori di formattazione tipici in tutte le lingue supportate.

  **Per tutte le lingue:**
  - Rimozione delle duplicazioni esatte di parole (`the the`, `jest jest`, `что что`, ecc.)
  - Compattamento di spazi multipli

  **Normalizzazione delle abbreviazioni (polacco `pl`):**
  - `m.in`, `m. in`, `m.in,` → `m.in.`; `np.,` → `np.`; `tzw.,` → `tzw.`; `tzn.` — set completo
  - `tj.`, `itd.`, `itp.` — ricongiungimento di abbreviazioni spezzate

  **Normalizzazione delle abbreviazioni (russo `ru`):**
  - `т. е.` → `т.е.`; `т. д.` → `т.д.`; `и т.д.` → forma unificata; e altre

  **Normalizzazione delle abbreviazioni (inglese `en`):**
  - `e. g.` → `e.g.`; `e.g,` → `e.g.,`; `i. e.` → `i.e.`; `etc .` → `etc.`

  > Obiettivo della normalizzazione: prevenire la divisione errata delle frasi da parte del tokenizer spaCy in corrispondenza delle abbreviazioni.

tok: |
  ## 3) Tokenizzazione

  La **tokenizzazione** è la suddivisione del testo in unità elementari: parole e segni di punteggiatura.
  spaCy lo fa con consapevolezza linguistica: gestisce correttamente apostrofi, trattini e abbreviazioni.

  ### 3.1 Tokenizzazione in parole
  Ogni documento viene trasformato in un elenco di token. Gli spazi bianchi sono esclusi.

  ### 3.2 Tokenizzazione in frasi
  spaCy segmenta anche il testo in frasi — utile per l'analisi della struttura, la sintesi estrattiva (tesi) e il rilevamento della lingua per frase prima dell'esportazione HTML/DOCX.

stop: |
  ## 4) Stop-word

  Le **stop-word** sono parole funzionali (articoli, preposizioni, pronomi) che portano poco significato.
  L'elenco viene preso direttamente dal modello spaCy caricato — è già ottimizzato per la lingua del corpus.
  Dopo il filtraggio, restano solo le parole semanticamente ricche.

lemma: |
  ## 5) Lemmatizzazione

  Il **lemma** è la forma base (di dizionario) di una parola. La lemmatizzazione riduce tutte le forme a una sola:
  «corre», «correvano», «correndo» → «correre»; «documents», «document» → «document».

  A differenza dello stemming, la lemmatizzazione usa un dizionario e regole grammaticali — il risultato è sempre una parola leggibile.
  In spaCy il lemma è disponibile tramite `token.lemma_`.

pos: |
  ## 6) Parti del discorso (POS tagging)

  Il **POS tagging** assegna a ogni token un ruolo grammaticale: sostantivo, verbo, aggettivo, ecc.
  spaCy restituisce due livelli:
  - `pos_` — il tag universale (NOUN, VERB, ADJ, ADV, PROPN …)
  - `tag_` — il tag dettagliato, specifico per la lingua

  La distribuzione POS rivela lo stile del testo: i testi scientifici contengono molti sostantivi; i testi letterari — molti verbi e aggettivi.

ner: |
  ## 7) Entità nominate (NER)

  **NER** (Named Entity Recognition) trova nomi, organizzazioni, luoghi, date, importi monetari e altri oggetti menzionati.
  spaCy restituisce una lista `doc.ents`, dove ogni entità ha un testo e un'etichetta.

  Etichette tipiche: PERSON, ORG, GPE (città/paese), DATE, MONEY, PRODUCT.

bow: |
  ## 8) Bag of words (CountVectorizer)

  **CountVectorizer** trasforma i testi in vettori numerici contando quante volte ogni parola appare in un documento.
  Il risultato è una matrice "documento × parola" in cui ogni riga è un documento e ogni colonna è una parola.

  ### 8.1 Unigrammi (parole singole)
  Rappresentazione di base: ogni parola è una caratteristica separata.

  ### 8.2 Bigrammi (coppie di parole)
  Aggiunge espressioni stabili: «machine learning», «natural language», «named entity».

tfidf: |
  ## 9) TF-IDF e ricerca automatica

  **TF-IDF** (Term Frequency — Inverse Document Frequency) pondera le parole: quelle frequenti in un documento ma rare negli altri ricevono un peso elevato.
  Questo rende la ricerca più intelligente di un semplice conteggio di parole.

  La **similarità coseno** misura l'angolo tra i vettori di due testi:
  - 1.0 = corrispondenza perfetta
  - 0.0 = nessuna parola in comune

  **Query automatica:** il notebook costruisce la query dalle parole con il peso TF-IDF medio più alto sull'intero corpus.
  Tale query garantisce una similarità coseno > 0 (non restituisce mai −1).

para: |
  ## Struttura del testo: paragrafi e frasi

  Uniamo l'intero corpus in un singolo flusso, lo dividiamo in frasi con il sentence-splitter di spaCy e le raggruppiamo a 3–6 in "paragrafi". Questa struttura viene consumata dai passaggi successivi (tesi, parole chiave, modellazione degli argomenti).

  Inoltre, per ogni paragrafo e ogni frase, `lingua` registra un codice ISO della lingua:

  - `para_langs[i]` — la lingua del paragrafo `i`-esimo nel suo insieme,
  - `sent_langs[i]` — la lingua della frase `i`-esima,
  - `para_sentences[i]` — l'elenco delle frasi che compongono il paragrafo `i`-esimo (necessario alla cella di esportazione).

  Questa lingua per-frammento viene scritta in `accessible_text.html` (`<p lang="...">`, e se necessario `<span lang="...">`) e in `accessible_text.docx` (`<w:lang>` a livello di `Run`), grazie al che gli screen reader e i motori TTS cambiano voce automaticamente.

foreign_resegment: |
  ## Risegmentazione dei blocchi in lingua straniera

  Nella cella precedente l'intero corpus è stato suddiviso in frasi dal modello spaCy **dominante**. Se nel corpus sono presenti blocchi continui in lingua straniera (ad es. una lunga citazione finlandese all'interno di un testo polacco), il modello LANG non conosce le abbreviazioni straniere (`ad es.`, `e.g.`, `esim.`) e può erroneamente trattare il punto dopo di esse come fine di frase — il frammento straniero viene spezzato a metà, e il contesto si perde tra le due "metà".

  Questa cella cerca sequenze di **due o più frasi consecutive nella stessa lingua straniera** (secondo `sent_langs` da cell_para) e rielabora ogni tale blocco con il proprio modello:

  1. Viene applicato `ABBREV_BY_LANG[lang]` — la normalizzazione delle abbreviazioni specifica per la lingua da cell_pl_corrector;
  2. `get_nlp(lang)(blocco)` — segmentazione corretta in frasi.

  Quindi `all_sents`, `sent_langs`, `paragraphs`, `para_sentences`, `para_langs`, `df_sent`, `df_para` e (per sicurezza) `para_lemmas` vengono ricostruiti. La cella successiva, l'analisi a due stadi, opera già sui confini corretti.

  Se nel corpus non ci sono frasi in lingua straniera — o ci sono, ma non formano blocchi ≥2 — la cella termina istantaneamente con un messaggio informativo, senza caricare modelli aggiuntivi.

multilang_pass: |
  ## Analisi multilingue a due stadi (NER + lemmatizzazione)

  Se il corpus contiene frammenti in più lingue, il modello spaCy dominante lemmatizza le parole in modo errato e classifica male le entità nominate nelle frasi in lingua straniera. Questa cella risolve il problema: ogni frase la cui lingua (rilevata da lingua nella cella precedente) differisce da quella principale viene rielaborata tramite `get_nlp(sent_lang)`.

  La cache LRU in `cell_model` limita l'uso di RAM a due modelli alla volta — il terzo espelle il meno recentemente utilizzato. Questo consente di passare il corpus sequenzialmente attraverso diversi modelli senza accumularli tutti in memoria.

  Dopo l'esecuzione della cella, `all_ents` e `para_lemmas` vengono ricostruiti tenendo conto della lingua di ogni frase, così l'esportazione di parole chiave, tesi, argomenti ed entità si basa sulla morfologia corretta.

  In assenza del modello spaCy necessario (o di `transformers`/`torch` per l'islandese), la cella, durante l'esecuzione, stampa un avviso esplicito sull'inaffidabilità dell'analisi per le frasi interessate e suggerisce il comando di installazione.

keywords: |
  ## Parole chiave (TF-IDF)

  Il TF-IDF a livello di paragrafo rivela termini caratteristici di frammenti specifici ma rari nel corpus complessivo. Qui otteniamo un elenco classificato di termini e frasi chiave (da 1 a 3 parole), ordinati per TF-IDF medio pesato.

theses: |
  ## Tesi (sintesi estrattiva)

  Per ogni paragrafo viene selezionata una **frase più informativa** (con la somma massima dei pesi TF-IDF). Il risultato è un elenco compatto di tesi, salvato in un file `.txt` localizzato sulla lingua del corpus in un formato adatto agli screen reader.

  Il parametro `N_THESES` definisce il numero massimo di tesi nel file.

topics: |
  ## Modellazione degli argomenti (KMeans)

  Ogni paragrafo è rappresentato come vettore spaCy e poi clusterizzato con l'algoritmo KMeans. Per ogni argomento vengono stampate parole chiave e un frammento di esempio.

  **Requisito:** il modello spaCy deve supportare i vettori di parole (ad es. `*_lg`). Con modelli senza vettori la modellazione degli argomenti viene saltata con un messaggio corrispondente.

export: |
  ## Esportazione dei risultati

  Salviamo tutte le tabelle nella cartella del progetto all'interno di `export_results/`:

  - **CSV** (UTF-8 BOM, si apre in Excel) — frasi, paragrafi, tesi, parole chiave TF-IDF, entità, argomenti.
  - **JSON** — parole chiave degli argomenti.
  - **TXT** — il file delle tesi localizzato (salvato al passaggio precedente).

  **Testo accessibile con tag linguistici** — due formati per la lettura offline tramite screen reader e TTS:

  - `accessible_text.html` — costruito tramite `BeautifulSoup`. Il `<html>` radice ha l'attributo `lang` della lingua dominante; ogni `<p>` riceve il proprio `lang` (da `para_langs`), e all'interno dei paragrafi misti ogni frase è racchiusa in `<span lang="...">` (da `sent_langs`). NVDA e JAWS leggono questi tag nativamente e cambiano voce al volo.
  - `accessible_text.docx` — assemblato tramite `python-docx`. Per ogni `Run` la proprietà `<w:lang>` è scritta esplicitamente (`pl-PL`, `ru-RU`, `en-US`, `it-IT`, `fi-FI`, `is-IS`). Word, il sintetizzatore Windows integrato (SAPI) e i lettori di terze parti si affidano a questo attributo offline, senza contattare rilevatori online.

  Questi file sostituiscono il precedente `testo_pulito_per_audio.txt` piatto: invece di un singolo profilo linguistico per l'intero flusso di testo, il lettore ora riceve la lingua corretta su ogni frammento.

summary: |
  ## Report di sintesi

  La cella sottostante raccoglie tutti i risultati chiave dell'analisi in un singolo report testuale.
  Il formato è ottimizzato per la lettura tramite screen reader (NVDA, JAWS): solo testo, senza colori, senza pseudografica.

qa_rag: |
  ## Sistema interattivo di domande e risposte (RAG)

  Un semplice ciclo "domanda — risposta" basato su TF-IDF e similarità coseno.
  Inserisci una domanda — il sistema troverà i 3 frammenti di testo più rilevanti dal corpus.

  Per uscire, digita: **wyjście**, **выход** o **exit**.
