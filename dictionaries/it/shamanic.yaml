oracle:
  header: |+
    --- ORACOLO DEL FLUSSO DI COSCIENZA ---
    Istruzione TTS: leggere lentamente, con eco crescente.

roots:
  header: |+
    --- RITO DELLE RADICI GREZZE ---
    Istruzione TTS: lettura meccanica, inumana, priva di emozioni.

lore:
  header: |+
    // FIRMA DEL RITROVAMENTO: TOPIC-{topic_id} / FRAGMENT-{para_id} //
    // STATO: REGISTRAZIONE RADIO DANNEGGIATA //

prophecy:
  header: |+
    --- LIBRO DELLE PROFEZIE DALLA POLVERE ---
    Istruzione TTS: leggere solennemente, con pause prima dei due punti.

  section: '[PROFEZIA {n}]'
  templates:
    - 'Dalla polvere di {loc} sorgerà {per}, per {sentence}'
    - 'Quando la luna di sangue penderà su {loc}, {per} pronuncerà: {sentence}'
    - 'Dalle viscere di {org} sussurrerà {per} verso {loc}: {sentence}'
    - "L'antica voce di {loc} parlerà attraverso {per}: {sentence}"
  fallback:
    loc: 'una terra senza nome'
    per: 'il Senza Nome'
    org: 'un ordine dimenticato'

katla:
  header: |+
    --- MONOLOGO DEGLI ESSERI GHIACCIATI (VOCE: KATLA) ---

vieno:
  header: |+
    --- INVOCAZIONE SCIAMANICA DEGLI ECHI (VOCE: VIENO) ---

lumi:
  header: |+
    --- DISPACCIO FINALE DAL NORD GHIACCIATO (VOCE: LUMI) ---

  fallback:
    katla: '(silenzio — Katla non ha ancora parlato)'
    vieno: '(quiete — il canto di Vieno non è giunto)'

sami:
  header: |+
    --- SCINTILLA DI SAMI: SINTESI ENERGETICA ---
    Istruzioni TTS: leggere con grande entusiasmo, un ampio sorriso e alta dinamica.

undertow:
  header: |+
    --- LA RISACCA: MAREA EMOTIVA DEL TESTO ---
    Istruzione TTS: leggere come un flusso e riflusso, con pause tra le onde.

  mood_negative: 'oscurità'
  mood_neutral: 'quiete'
  mood_positive: 'luce'
  summary_header: 'Bilancio della marea:'

pipeline:
  starting: 'Avvio del condotto sciamanico di elaborazione...'
  info_detected_lang: '[INFO] Lingua del corpus rilevata: {language}'
  warn_no_export_dir: '[AVVISO] La directory {path} non esiste.'
  ok_oracle: '[OK] Oracolo generato: {filename}'
  ok_lore: '[OK] Frammenti di lore generati: {dirname}/'
  ok_roots: '[OK] Radici Grezze generate: {filename}'
  ok_prophecies: '[OK] Profezie generate: {filename}'
  ok_undertow: '[OK] Risacca generata: {filename}'
  done: '[COMPLETATO] Tutti gli artefatti audio sono pronti nella cartella audio_scripts.'
  fatal_error: '[ERRORE CRITICO] {error}'

ai:
  starting: "Avvio degli incantesimi LLM avanzati con la chiave dall'aldilà..."
  info_detected_lang: '[INFO] Lingua del corpus rilevata: {language}'
  llm_katla: '[LLM] Evocazione degli spiriti per il Rito della Trasformazione...'
  ok_katla: '[OK] Monologo di Katla salvato in: {filename}'
  llm_vieno: '[LLM] Intreccio di dimensioni per il Rito degli Echi...'
  ok_vieno: '[OK] Canto di Vieno salvato in: {filename}'
  llm_lumi: '[LLM] Chiamata di Lumi per il dispaccio finale...'
  ok_lumi: '[OK] Dispaccio di Lumi salvato in: {filename}'
  llm_sami: "[LLM] Evocazione della scintilla di Sami per illuminare l'oscurità del Nord..."
  ok_sami: '[OK] Sintesi scintillante di Sami salvata in: {filename}'
  done: '[COMPLETATO] Magia eseguita con successo.'
  fatal_error: '[ERRORE CRITICO] {error}'
