oracle:
  header: |+
    --- WYROCZNIA STRUMIENIA ŚWIADOMOŚCI ---
    Instrukcja TTS: czytać powoli, z narastającym echem.

roots:
  header: |+
    --- RYTUAŁ SUROWYCH RDZENI ---
    Instrukcja TTS: odczyt mechaniczny, nieludzki, pozbawiony emocji.

lore:
  header: |+
    // SYGNATURA ZNALEZISKA: TOPIC-{topic_id} / FRAGMENT-{para_id} //
    // STATUS: USZKODZONY ZAPIS RADIOWY //

prophecy:
  header: |+
    --- KSIĘGA PRZEPOWIEDNI Z PYŁU ---
    Instrukcja TTS: czytać dostojnie, z pauzami przed dwukropkami.

  section: '[PRZEPOWIEDNIA {n}]'
  templates:
    - 'Z pyłu {loc} wstanie {per}, aby {sentence}'
    - 'Gdy księżyc krwi zawiśnie nad {loc}, {per} wyrzeknie: {sentence}'
    - 'Z trzewi {org} wyszepcze {per} ku {loc}: {sentence}'
    - 'Pradawny głos {loc} przemówi przez {per}: {sentence}'
  fallback:
    loc: 'bezimiennej krainy'
    per: 'Bezimienny'
    org: 'zapomnianego zakonu'

katla:
  header: |+
    --- MONOLOG ZAMROŻONYCH BYTÓW (GŁOS: KATLA) ---

vieno:
  header: |+
    --- SZAMAŃSKA INWOKACJA ECH (GŁOS: VIENO) ---

lumi:
  header: |+
    --- MELDUNEK OSTATECZNY Z MROŹNEJ PÓŁNOCY (GŁOS: LUMI) ---

  fallback:
    katla: '(milczenie — Katla jeszcze nie przemówiła)'
    vieno: '(cisza — pieśń Vieno nie dotarła)'

sami:
  header: |+
    --- ISKRA SAMI: ENERGETYCZNA SYNTEZA ---
    Instrukcja TTS: czytać z ogromnym entuzjazmem, szerokim uśmiechem i wysoką dynamiką.

undertow:
  header: |+
    --- PRĄD PODSKÓRNY: EMOCJONALNY PŁYW TEKSTU ---
    Instrukcja TTS: czytać jak przypływ i odpływ, z pauzami między falami.

  mood_negative: 'mrok'
  mood_neutral: 'cisza'
  mood_positive: 'światło'
  summary_header: 'Bilans pływu:'

pipeline:
  starting: 'Inicjowanie szamańskiego potoku przetwarzania...'
  info_detected_lang: '[INFO] Wykryty język korpusu: {language}'
  warn_no_export_dir: '[OSTRZEŻENIE] Katalog {path} nie istnieje.'
  ok_oracle: '[OK] Wygenerowano Wyrocznię: {filename}'
  ok_lore: '[OK] Wygenerowano Znajdźki: {dirname}/'
  ok_roots: '[OK] Wygenerowano Surowe Rdzenie: {filename}'
  ok_prophecies: '[OK] Wygenerowano Przepowiednie: {filename}'
  ok_undertow: '[OK] Wygenerowano Prąd Podskórny: {filename}'
  done: '[ZAKOŃCZONO] Wszystkie artefakty audio są gotowe w folderze audio_scripts.'
  fatal_error: '[BŁĄD KRYTYCZNY] {error}'

ai:
  starting: 'Inicjowanie zaawansowanych czarów LLM z kluczem z zaświatów...'
  info_detected_lang: '[INFO] Wykryty język korpusu: {language}'
  llm_katla: '[LLM] Wywoływanie duchów dla Rytuału Transformacji...'
  ok_katla: '[OK] Zapisano monolog Katli w: {filename}'
  llm_vieno: '[LLM] Splecenie wymiarów dla Rytuału Ech...'
  ok_vieno: '[OK] Zapisano pieśń Vieno w: {filename}'
  llm_lumi: '[LLM] Zwołanie Lumi do ostatecznej relacji...'
  ok_lumi: '[OK] Zapisano meldunek Lumi w: {filename}'
  llm_sami: '[LLM] Przyzywanie iskry Sami do rozjaśnienia mroku Północy...'
  ok_sami: '[OK] Zapisano iskrzącą relację Sami w: {filename}'
  done: '[ZAKOŃCZONO] Magia odprawiona pomyślnie.'
  fatal_error: '[BŁĄD KRYTYCZNY] {error}'
