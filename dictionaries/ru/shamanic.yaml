oracle:
  header: |+
    --- ОРАКУЛ ПОТОКА СОЗНАНИЯ ---
    Инструкция TTS: читать медленно, с нарастающим эхом.

roots:
  header: |+
    --- РИТУАЛ СЫРЫХ КОРНЕЙ ---
    Инструкция TTS: чтение механическое, нечеловеческое, лишённое эмоций.

lore:
  header: |+
    // СИГНАТУРА НАХОДКИ: TOPIC-{topic_id} / FRAGMENT-{para_id} //
    // СТАТУС: ПОВРЕЖДЁННАЯ РАДИОЗАПИСЬ //

prophecy:
  header: |+
    --- КНИГА ПРОРОЧЕСТВ ИЗ ПРАХА ---
    Инструкция TTS: читать торжественно, с паузами перед двоеточиями.

  section: '[ПРОРОЧЕСТВО {n}]'
  templates:
    - 'Из праха {loc} восстанет {per}, дабы {sentence}'
    - 'Когда кровавая луна повиснет над {loc}, {per} изречёт: {sentence}'
    - 'Из чрева {org} прошепчет {per} к {loc}: {sentence}'
    - 'Древний голос {loc} проговорит через {per}: {sentence}'
  fallback:
    loc: 'безымянной земли'
    per: 'Безымянный'
    org: 'забытого ордена'

katla:
  header: |+
    --- МОНОЛОГ ЗАМЁРЗШИХ СУЩНОСТЕЙ (ГОЛОС: КАТЛА) ---

vieno:
  header: |+
    --- ШАМАНСКАЯ ИНВОКАЦИЯ ОТЗВУКОВ (ГОЛОС: ВИЕНО) ---

lumi:
  header: |+
    --- ПОСЛЕДНИЙ ОТЧЁТ С МОРОЗНОГО СЕВЕРА (ГОЛОС: ЛУМИ) ---

  fallback:
    katla: '(молчание — Катла ещё не заговорила)'
    vieno: '(тишина — песнь Виено не дошла)'

sami:
  header: |+
    --- ИСКРА САМИ: ЭНЕРГИЧНЫЙ СИНТЕЗ ---
    Инструкция TTS: читать с огромным энтузиазмом, широкой улыбкой и высокой динамикой.

pipeline:
  starting: 'Инициализация шаманского конвейера обработки...'
  info_detected_lang: '[ИНФО] Распознан язык корпуса: {language}'
  warn_no_export_dir: '[ВНИМАНИЕ] Каталог {path} не существует.'
  ok_oracle: '[OK] Сгенерирован Оракул: {filename}'
  ok_lore: '[OK] Сгенерированы Обломки Лора: {dirname}/'
  ok_roots: '[OK] Сгенерированы Сырые Корни: {filename}'
  ok_prophecies: '[OK] Сгенерированы Пророчества: {filename}'
  done: '[ЗАВЕРШЕНО] Все аудио-артефакты готовы в папке audio_scripts.'
  fatal_error: '[КРИТИЧЕСКАЯ ОШИБКА] {error}'

ai:
  starting: 'Инициализация продвинутых LLM-чар с ключом из потустороннего мира...'
  info_detected_lang: '[ИНФО] Распознан язык корпуса: {language}'
  llm_katla: '[LLM] Призыв духов для Ритуала Трансформации...'
  ok_katla: '[OK] Монолог Катлы сохранён в: {filename}'
  llm_vieno: '[LLM] Сплетение измерений для Ритуала Отзвуков...'
  ok_vieno: '[OK] Песнь Виено сохранена в: {filename}'
  llm_lumi: '[LLM] Призыв Лумми к окончательному отчёту...'
  ok_lumi: '[OK] Отчёт Лумми сохранён в: {filename}'
  llm_sami: '[LLM] Призыв искры Сами, чтобы озарить мрак Севера...'
  ok_sami: '[OK] Искрящийся синтез Сами сохранён в: {filename}'
  done: '[ЗАВЕРШЕНО] Магия совершена успешно.'
  fatal_error: '[КРИТИЧЕСКАЯ ОШИБКА] {error}'
