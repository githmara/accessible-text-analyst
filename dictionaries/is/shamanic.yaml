oracle:
  header: |+
    --- ORAKEL VITUNDARSTREYMIS ---
    TTS-leiðbeining: lestu hægt, með vaxandi bergmáli.

roots:
  header: |+
    --- RITÚAL HRÁU RÓTANNA ---
    TTS-leiðbeining: vélrænn lestur, ómannlegur, tilfinningalaus.

lore:
  header: |+
    // FUNDARSKILRÍKI: TOPIC-{topic_id} / FRAGMENT-{para_id} //
    // STAÐA: SKEMMD ÚTVARPSSKRÁ //

prophecy:
  header: |+
    --- BÓK SPÁDÓMA ÚR RYKINU ---
    TTS-leiðbeining: lestu með reisn, með pásu fyrir tvípunkta.

  section: '[SPÁDÓMUR {n}]'
  templates:
    - 'Úr ryki — {loc} — rís {per}, til þess að: {sentence}'
    - 'Þegar blóðtunglið hangir yfir staðnum {loc}, mun {per} mæla: {sentence}'
    - 'Úr innyflum reglunnar {org} hvíslar {per} til staðarins {loc}: {sentence}'
    - 'Forn rödd — {loc} — talar gegnum {per}: {sentence}'
  fallback:
    loc: 'ónefnt land'
    per: 'hinn nafnlausi'
    org: 'gleymd regla'

katla:
  header: |+
    --- EINTAL FROSINNA VERA (RÖDD: KATLA) ---

vieno:
  header: |+
    --- SEIÐKALL BERGMÁLA (RÖDD: VIENO) ---

lumi:
  header: |+
    --- LOKASKÝRSLA FRÁ FROSNU NORÐRI (RÖDD: LUMI) ---

  fallback:
    katla: '(þögn — Katla hefur ekki enn talað)'
    vieno: '(kyrrð — söngur Vieno hefur ekki borist)'

sami:
  header: |+
    --- NEISTI SAMI: ORKUMIKIL SAMANTEKT ---
    TTS leiðbeiningar: lesa með miklum eldmóði, breiðu brosi og mikilli dýnamík.

pipeline:
  starting: 'Ræsi seiðmagnaða úrvinnsluleiðslu...'
  info_detected_lang: '[UPPLÝSINGAR] Greint tungumál safnsins: {language}'
  warn_no_export_dir: '[VIÐVÖRUN] Mappa {path} er ekki til.'
  ok_oracle: '[OK] Orakel búið til: {filename}'
  ok_lore: '[OK] Sagnabrot búin til: {dirname}/'
  ok_roots: '[OK] Hráar Rætur búnar til: {filename}'
  ok_prophecies: '[OK] Spádómar búnir til: {filename}'
  done: '[LOKIÐ] Öll hljóð-artefaktar eru tilbúin í möppunni audio_scripts.'
  fatal_error: '[ALVARLEG VILLA] {error}'

ai:
  starting: 'Ræsi háþróaða LLM-galdra með lykli úr handanheimum...'
  info_detected_lang: '[UPPLÝSINGAR] Greint tungumál safnsins: {language}'
  llm_katla: '[LLM] Kalla á andana fyrir Ummyndunarsiðinn...'
  ok_katla: '[OK] Eintal Kötlu vistað í: {filename}'
  llm_vieno: '[LLM] Vef víddir fyrir Bergmálssiðinn...'
  ok_vieno: '[OK] Söngur Vieno vistaður í: {filename}'
  llm_lumi: '[LLM] Kalla Lumi til lokaskýrslunnar...'
  ok_lumi: '[OK] Skýrsla Lumi vistuð í: {filename}'
  llm_sami: '[LLM] Kalla á neista Sami til að lýsa upp myrkrið í Norðri...'
  ok_sami: '[OK] Glampandi samantekt Sami vistuð í: {filename}'
  done: '[LOKIÐ] Galdrar framkvæmdir með góðum árangri.'
  fatal_error: '[ALVARLEG VILLA] {error}'
