oracle:
  header: |+
    --- ORAKEL VITUNDARSTREYMIS ---
    TTS-leiðbeining: lestu hægt, með vaxandi bergmáli.

  pause: '[HLÉ 1.5s]'

roots:
  header: |+
    --- RITÚAL HRÁU RÓTANNA ---
    TTS-leiðbeining: vélrænn lestur, ómannlegur, tilfinningalaus.

lore:
  header: |+
    // FUNDARSKILRÍKI: TOPIC-{topic_id} / FRAGMENT-{para_id} //
    // STAÐA: SKEMMD ÚTVARPSSKRÁ //

prophecy:
  header: |+
    --- BÓK SPÁDÓMA ÚR RYKINU ---
    TTS-leiðbeining: lestu með reisn, með pásu fyrir tvípunkta.

  section: '[SPÁDÓMUR {n}]'
  templates:
    - 'Úr ryki — {loc} — rís {per}, til þess að: {sentence}'
    - 'Þegar blóðtunglið hangir yfir staðnum {loc}, mun {per} mæla: {sentence}'
    - 'Úr innyflum reglunnar {org} hvíslar {per} til staðarins {loc}: {sentence}'
    - 'Forn rödd — {loc} — talar gegnum {per}: {sentence}'
  fallback:
    loc: 'ónefnt land'
    per: 'hinn nafnlausi'
    org: 'gleymd regla'

katla:
  header: |+
    --- EINTAL FROSINNA VERA (RÖDD: KATLA) ---

vieno:
  header: |+
    --- SEIÐKALL BERGMÁLA (RÖDD: VIENO) ---

lumi:
  header: |+
    --- LOKASKÝRSLA FRÁ FROSNU NORÐRI (RÖDD: LUMI) ---

  fallback:
    katla: '(þögn — Katla hefur ekki enn talað)'
    vieno: '(kyrrð — söngur Vieno hefur ekki borist)'

sami:
  header: |+
    --- NEISTI SAMI: ORKUMIKIL SAMANTEKT ---
    TTS leiðbeiningar: lesa með miklum eldmóði, breiðu brosi og mikilli dýnamík.

undertow:
  header: |+
    --- UNDIRSTRAUMUR: TILFINNINGAFLÓÐ TEXTANS ---
    TTS-leiðbeining: lestu eins og flóð og fjöru, með pásu milli bylgjanna.

  mood_negative: 'myrkur'
  mood_neutral: 'kyrrð'
  mood_positive: 'ljós'
  summary_header: 'Jafnvægi flóðsins:'

pipeline:
  starting: 'Ræsi seiðmagnaða úrvinnsluleiðslu...'
  info_detected_lang: '[UPPLÝSINGAR] Greint tungumál safnsins: {language}'
  warn_no_export_dir: '[VIÐVÖRUN] Mappa {path} er ekki til.'
  ok_oracle: '[OK] Orakel búið til: {filename}'
  ok_lore: '[OK] Sagnabrot búin til: {dirname}/'
  ok_roots: '[OK] Hráar Rætur búnar til: {filename}'
  ok_prophecies: '[OK] Spádómar búnir til: {filename}'
  ok_undertow: '[OK] Undirstraumur búinn til: {filename}'
  done: '[LOKIÐ] Öll hljóð-artefaktar eru tilbúin í möppunni audio_scripts.'
  warn_ritual_failed: '[VILLA] Helgisiðurinn "{ritual}" mistókst: {error}'
  done_with_errors: '[ÓLOKIÐ] Ekki tókust allir helgisiðir ({failed} af {total}). Eitthvað fór úrskeiðis — sjá skilaboðin að ofan.'
  warn_nothing_produced: '[ÓLOKIÐ] Engin hljóðafurð varð til. Líklega var minnisbókin (eða útflutningsreitur hennar) ekki keyrð í {path}.'
  err_no_notebook_output: 'Nauðsynlega skrá {path} vantar — líklega var minnisbókin (eða útflutningsreitur hennar) ekki keyrð.'
  err_faulty_input: 'Skráin {filename} er tóm eða skemmd — eitthvað fór úrskeiðis í helgisiðnum "{ritual}".'
  fatal_error: '[ALVARLEG VILLA] {error}'

ai:
  starting: 'Ræsi háþróaða LLM-galdra með lykli úr handanheimum...'
  info_detected_lang: '[UPPLÝSINGAR] Greint tungumál safnsins: {language}'
  llm_katla: '[LLM] Kalla á andana fyrir Ummyndunarsiðinn...'
  ok_katla: '[OK] Eintal Kötlu vistað í: {filename}'
  llm_vieno: '[LLM] Vef víddir fyrir Bergmálssiðinn...'
  ok_vieno: '[OK] Söngur Vieno vistaður í: {filename}'
  llm_lumi: '[LLM] Kalla Lumi til lokaskýrslunnar...'
  ok_lumi: '[OK] Skýrsla Lumi vistuð í: {filename}'
  llm_sami: '[LLM] Kalla á neista Sami til að lýsa upp myrkrið í Norðri...'
  ok_sami: '[OK] Glampandi samantekt Sami vistuð í: {filename}'
  done: '[LOKIÐ] Galdrar framkvæmdir með góðum árangri.'
  warn_ritual_failed: '[VILLA] Helgisiðurinn "{ritual}" mistókst: {error}'
  done_with_errors: '[ÓLOKIÐ] Ekki tókust allir LLM-helgisiðir ({failed} af {total}). Eitthvað fór úrskeiðis — sjá skilaboðin að ofan.'
  warn_nothing_produced: '[ÓLOKIÐ] Engin rödd Norðursins talaði. Líklega var minnisbókin ekki keyrð eða staðbundna ferlið (prophecies.txt) ekki keyrt fyrst.'
  err_no_export_dir: 'Mappan {path} er ekki til — líklega var minnisbókin (eða útflutningsreitur hennar) ekki keyrð.'
  err_no_notebook_output: 'Skrána {path} vantar þótt umfjöllunarefni séu til — eitthvað fór úrskeiðis við útflutning minnisbókarinnar.'
  warn_vieno_too_few_sentences: 'Sýn Vieno byggir á færri en 5 hráum setningum ({count} fundust) — söngurinn yrði of þunnur, svo helgisiðnum var hætt. Athugaðu hvort minnisbókin bjó til fulla sentences.csv-skrá.'
  fatal_error: '[ALVARLEG VILLA] {error}'
