# „c.-à-d.”, „av. J.-C.” i „n°” odpadają: audyt dopuszcza w skrótowcu tylko
# litery i kropki. „Mme”/„Mlle” piszą się bez kropki, więc nie są skrótowcami.
# Konwencja projektu jak w ru: wieloczłonowe scalane bez spacji („p. ex.” → „p.ex.”).
