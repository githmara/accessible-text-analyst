name: Release (from release_notes.md)

# Wydanie powstaje SAMO, gdy na main trafia sekcja `## vX.Y.Z — tytuł` na
# szczycie release_notes.md, a tagu vX.Y.Z jeszcze nie ma. Tag i Release
# powstają atomowo (`gh release create --target <sha>`), z tytułem i treścią
# wyciętymi z tej sekcji. Plik VERSION celowo nie istnieje: projekt jest
# source-only, numer żyje w notatkach i w tagu.
#
# Dlaczego to nie otwiera furtki (analiza przed wdrożeniem, 2026-10-15):
#   * jedyne wyzwalacze to `push` na main i ręczny `workflow_dispatch` — oba
#     wymagają prawa zapisu, które i tak pozwala zmienić ten plik. PR z forka
#     NIE wyzwala `push` w repo bazowym; `pull_request_target` jest tu zakazany;
#   * treść notatek to DANE: zero `${{ }}` w `run:`, wersja przechodzi ścisły
#     wzorzec w wydanie.py, tytuł i treść idą przez pliki i zmienne środowiska;
#   * uprawnienia minimalne i tylko w jobie (`contents: write`), checkout bez
#     zapamiętanego tokena, akcja przypięta do SHA;
#   * wydanie „wstecz” (wersja nie wyższa od najnowszego tagu) = błąd, istniejący
#     tag = spokojny no-op; `concurrency` wyklucza dwa równoległe przebiegi.

on:
  push:
    branches: [main]
    paths: [release_notes.md, .github/workflows/release.yml, .github/scripts/**]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # PyYAML dla bramek, lingua dla audytu podstaw (pole `lingua` musi być
      # członkiem lingua.Language o kodzie ISO katalogu — decyzja maintainera
      # 2026-10-16: weryfikacja w CI, nie tylko lokalnie). setup-python zamiast
      # systemowego Pythona: na ubuntu-latest systemowy pip odmawia instalacji
      # (PEP 668). Granice powtarzają manifest — runner nie czyta requirements.txt.
      - name: Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'

      - name: Install PyYAML and lingua
        run: python -m pip install --quiet "pyyaml<6.1" "lingua-language-detector<2.3"

      - name: Self-test
        run: |
          python .github/scripts/test_wydanie.py
          python .github/scripts/test_parytet.py
          python .github/scripts/test_bramka_printow.py
          python .github/scripts/test_audyt_podstaw.py
          python .github/scripts/test_zrodlo_raportu.py
          # Wspólny moduł z Reżyserem (bajt w bajt) — runner i wektory też wspólne, sam stdlib.
          python czyszczenie_tekstu_wektory.py

      # Rozjazd tłumaczeń (klucze, placeholdery, struktura i polecenia w README ×6)
      # BLOKUJE wydanie — odpowiednik `--waliduj` z Reżysera.
      - name: Translation parity gate
        run: python .github/scripts/parytet.py

      # print() w skryptach samodzielnych idzie przez t(UI_LANG, …) — hard-kod
      # w konsoli BLOKUJE wydanie (notatnik celowo rosyjski, poza zakresem).
      - name: Console hard-code gate
        run: python .github/scripts/bramka_printow.py

      # Język jest wyliczony RAZ: dictionaries/<kod>/podstawy.yaml. Audyt
      # sprawdza komplet i treść podstaw, README_<kod>.md, nawrót wyliczeń
      # języków w kodzie oraz sondą indeksu spaCy, czy język z `spacy: null`
      # nie dostał modelu. Indeks nieosiągalny = czerwone „cannot verify”
      # (exit 3), nigdy fałszywe zielone — wydanie czeka na powtórkę.
      - name: Language basics audit
        run: python .github/scripts/audyt_podstaw.py

      - name: Decide from release_notes.md and existing tags
        id: decyzja
        run: |
          git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" > "$RUNNER_TEMP/tagi.txt"
          python .github/scripts/wydanie.py "$RUNNER_TEMP/tagi.txt"

      - name: Create tag and release
        if: steps.decyzja.outputs.decyzja == 'wydaj'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decyzja.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$(cat "$RUNNER_TEMP/tytul.txt")" \
            --notes-file "$RUNNER_TEMP/tresc.md" \
            --latest
          echo "Released $TAG at $GITHUB_SHA"

      - name: Nothing to release
        if: steps.decyzja.outputs.decyzja == 'pomin'
        env:
          TAG: ${{ steps.decyzja.outputs.tag }}
        run: echo "Tag $TAG already exists — nothing to release."
